<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Command Center</title><style>body{margin:0;background:#070b14;color:#eef4ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}.wrap{max-width:1100px;margin:auto;padding:20px 14px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.title{font-size:25px;font-weight:800}.sub{font-size:12px;color:#8fa0bd}.btn{background:#10192b;color:#eef4ff;border:1px solid #22304a;border-radius:12px;padding:10px 13px;font-weight:700}.stats,.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:15px}.stat,.card{background:#0f1626;border:1px solid #22304a;border-radius:17px;padding:15px}.stat b{font-size:23px;display:block}.stat span{font-size:11px;color:#8fa0bd;text-transform:uppercase}.grid{grid-template-columns:repeat(2,1fr)}.head,.main,.item{display:flex;justify-content:space-between;gap:10px}.name{font-size:18px;font-weight:800}.repo,.time{font-size:11px;color:#8fa0bd}.badge{font-size:11px;font-weight:800;padding:6px 9px;border-radius:99px}.ok{background:#123e30;color:#37d996}.bad{background:#461b25;color:#ff8b99}.run{background:#3d3313;color:#ffd166}.neutral{background:#202b3e;color:#aebbd0}.main{align-items:end;margin:16px 0 12px}.runno{font-size:29px;font-weight:850}.open{background:#62a8ff;color:#08111e;text-decoration:none;padding:9px 11px;border-radius:10px;font-size:12px;font-weight:800}.recent{border-top:1px solid #22304a;padding-top:10px}.recent-title{font-size:10px;color:#8fa0bd;text-transform:uppercase}.item{padding:7px 0;border-bottom:1px solid #19253a}.item a{color:#eef4ff;text-decoration:none;font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#74829a;margin-right:7px}.dot.ok{background:#37d996}.dot.bad{background:#ff6577}.dot.run{background:#ffd166}.empty,.err{font-size:12px;color:#8fa0bd;padding:10px 0}.err{color:#ff9aa6}.foot{text-align:center;color:#64738c;font-size:11px;margin-top:20px}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.title{font-size:21px}}</style></head><body><div class="wrap"><div class="top"><div><div class="title">⚡ AI Command Center</div><div class="sub">GitHub Automation Monitor • 4 pipelines</div></div><button class="btn" onclick="loadAll()">↻ Refresh</button></div><div class="stats"><div class="stat"><b>4</b><span>Automations</span></div><div class="stat"><b id="success">—</b><span>Success</span></div><div class="stat"><b id="running">—</b><span>Running</span></div><div class="stat"><b id="failed">—</b><span>Failed</span></div></div><div id="grid" class="grid"></div><div class="foot">Live public GitHub Actions data • <span id="updated">—</span></div></div><script>
const P=[['🎨','Toon Kids','toon_kids_automation','toon_kids_daily.yml'],['🧠','Think Fast Daily','think-fast-daily-automation','think-fast-daily.yml'],['🔮','What If Daily','what-if-daily-automation','what_if_daily.yml'],['🌎','FactVerse AI','factverse-ai-automation','factverse.yml']],O='connectwithds5-wq';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ago=x=>{let m=Math.floor((Date.now()-new Date(x))/60000);return m<1?'just now':m<60?m+' min ago':m<1440?Math.floor(m/60)+' hr ago':Math.floor(m/1440)+' day(s) ago'};
const cls=s=>s==='success'?'ok':['failure','cancelled','timed_out'].includes(s)?'bad':['in_progress','queued','waiting','requested'].includes(s)?'run':'neutral';
const label=s=>({success:'SUCCESS',failure:'FAILED',cancelled:'CANCELLED',in_progress:'RUNNING',queued:'QUEUED',timed_out:'TIMEOUT'}[s]||(s||'UNKNOWN').toUpperCase());
async function one(p){let u=`https://api.github.com/repos/${O}/${p[2]}/actions/workflows/${encodeURIComponent(p[3])}/runs?per_page=8`,r=await fetch(u);if(!r.ok)throw Error('GitHub API '+r.status);return r.json()}
function card(p,d){let a=d.workflow_runs||[],x=a[0];if(!x)return `<div class=card><div class=name>${p[0]} ${p[1]}</div><div class=empty>No workflow runs found.</div></div>`;let s=x.conclusion||x.status;return `<div class=card><div class=head><div><div class=name>${p[0]} ${p[1]}</div><div class=repo>${O}/${p[2]}</div></div><span class="badge ${cls(s)}">${label(s)}</span></div><div class=main><div><div class=runno>Run #${x.run_number}</div><div class=time>${ago(x.updated_at)} • ${new Date(x.updated_at).toLocaleString()}</div></div><a class=open href="https://github.com/${O}/${p[2]}/actions/runs/${x.id}" target=_blank>Open Run ↗</a></div><div class=recent><div class=recent-title>Recent runs</div>${a.slice(0,6).map(q=>{let z=q.conclusion||q.status;return `<div class=item><a href="https://github.com/${O}/${p[2]}/actions/runs/${q.id}" target=_blank><span class="dot ${cls(z)}"></span>#${q.run_number} ${esc(q.event||'workflow')}</a><span class=time>${ago(q.updated_at)}</span></div>`}).join('')}</div></div>`}
async function loadAll(){let g=document.getElementById('grid');g.innerHTML=P.map(p=>`<div class="card"><div class=name>${p[0]} ${p[1]}</div><div class=empty>Loading GitHub Actions…</div></div>`).join('');let R=[];for(let p of P)try{R.push([p,await one(p)])}catch(e){R.push([p,null,e])}g.innerHTML=R.map(v=>v[1]?card(v[0],v[1]):`<div class=card><div class=name>${v[0][0]} ${v[0][1]}</div><div class=err>Could not load GitHub Actions data: ${esc(v[2].message)}</div><div style="margin-top:10px"><a class=open href="https://github.com/${O}/${v[0][2]}/actions/workflows/${v[0][3]}" target=_blank>Open Actions ↗</a></div></div>`).join('');let s=0,f=0,r=0;R.forEach(v=>{let x=v[1]?.workflow_runs?.[0],c=x?.conclusion,t=x?.status;if(c==='success')s++;else if(['failure','cancelled','timed_out'].includes(c))f++;else if(['in_progress','queued','waiting','requested'].includes(t))r++});success.textContent=s;failed.textContent=f;running.textContent=r;updated.textContent=new Date().toLocaleString()}loadAll();setInterval(loadAll,120000);
</script></body></html>
