<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b14"><title>⚡ AI Command Center V8</title><style>*{box-sizing:border-box}body{margin:0;background:#070b14;color:#eef4ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}.wrap{max-width:1100px;margin:auto;padding:18px 14px 30px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.title{font-size:25px;font-weight:900}.sub,.repo,.time{font-size:11px;color:#8fa0bd}.btn,.runbtn,.open{border-radius:11px;padding:10px 13px;font-weight:800;border:1px solid #263753;text-decoration:none;font-size:11px}.btn{background:#10192b;color:#eef4ff;cursor:pointer}.stats,.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:15px}.grid{grid-template-columns:repeat(2,1fr)}.stat,.card{background:#0f1626;border:1px solid #22304a;border-radius:17px;padding:15px}.stat b{display:block;font-size:24px}.stat span,.section-label{font-size:10px;color:#8fa0bd;text-transform:uppercase}.head,.main,.item{display:flex;justify-content:space-between;gap:10px}.name{font-size:18px;font-weight:850}.badge{font-size:10px;font-weight:850;padding:6px 9px;border-radius:20px;white-space:nowrap}.ok{background:#123e30;color:#37d996}.bad{background:#461b25;color:#ff8b99}.run{background:#3d3313;color:#ffd166}.neutral{background:#202b3e;color:#aebbd0}.main{align-items:end;margin:17px 0 13px}.runno{font-size:28px;font-weight:900}.actions{display:flex;gap:7px;flex-wrap:wrap}.runbtn{background:#173c31;color:#48e0a4;border-color:#285d4d;cursor:pointer}.runbtn:disabled{opacity:.55;cursor:wait}.open{background:#62a8ff;color:#08111e}.recent{border-top:1px solid #22304a;padding-top:10px}.item{padding:7px 0;border-bottom:1px solid #19253a}.item a{color:#eef4ff;text-decoration:none;font-size:11px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#74829a;margin-right:7px}.dot.ok{background:#37d996}.dot.bad{background:#ff6577}.dot.run{background:#ffd166}.schedule,.ai-box{margin:11px 0;padding:10px;background:#0b1220;border:1px solid #1d2b42;border-radius:12px;font-size:11px;color:#9baaca}.ai-box{border-color:#3b2945}.ai-title{font-size:12px;font-weight:900;color:#ffd166;margin-bottom:7px}.ai-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.ai-metric{padding:7px 8px;background:#101a2b;border-radius:9px}.ai-metric b{display:block;font-size:12px;color:#eef4ff}.ai-metric span{font-size:9px;color:#8fa0bd;text-transform:uppercase}.ai-line{margin-top:7px;font-size:10px;line-height:1.5;color:#b9c5d8}.pill{display:inline-block;font-size:9px;font-weight:850;padding:4px 7px;border-radius:20px;background:#202b3e;color:#ffd166;margin:2px}.empty,.err{font-size:12px;color:#8fa0bd;padding:10px 0}.err{color:#ff9aa6}.foot{text-align:center;color:#64738c;font-size:10px;margin-top:20px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#101b2d;border:1px solid #30425f;color:#eef4ff;padding:11px 16px;border-radius:12px;font-size:12px;font-weight:700;display:none;z-index:99}.history{max-height:130px;overflow:auto}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.title{font-size:21px}.main{align-items:flex-start;flex-direction:column}.ai-grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div><div class="title">⚡ AI Command Center V8</div><div class="sub">GitHub Automation Control • Workflow + AI Analytics in one card</div></div><button class="btn" onclick="loadAll()">↻ Refresh</button></div><div class="stats"><div class="stat"><b>6</b><span>Automations</span></div><div class="stat"><b id="success">—</b><span>Latest Success</span></div><div class="stat"><b id="running">—</b><span>Latest Running</span></div><div class="stat"><b id="failed">—</b><span>Latest Failed</span></div></div><div id="grid" class="grid"></div><div class="foot">Live GitHub Actions + AI strategy • V8 • <span id="updated">—</span></div></div><div id="toast" class="toast"></div><script>const OWNER="connectwithds5-wq",RELAY_URL="https://ai-command-center-relay.darjid314.workers.dev";const U={whatif:"https://raw.githubusercontent.com/connectwithds5-wq/what-if-daily-automation/main/growth_strategy.json",history:"https://raw.githubusercontent.com/connectwithds5-wq/what-if-daily-automation/main/topic_history.json",think:"https://raw.githubusercontent.com/connectwithds5-wq/think-fast-daily-automation/main/think_fast_strategy.json",social:"https://raw.githubusercontent.com/connectwithds5-wq/auto-social-post/main/strategy.json",hindi:"https://raw.githubusercontent.com/connectwithds5-wq/hindi-emotional-reels-automation/main/data/strategy.json",factverse:"https://raw.githubusercontent.com/connectwithds5-wq/factverse-ai-automation/main/data/strategy.json"};const P=[["🎨","Toon Kids","toon_kids_automation","toon_kids_daily.yml","1:00 PM & 8:30 PM IST","none"],["🧠","Think Fast Daily","think-fast-daily-automation","think-fast-daily.yml","12:00 PM & 6:00 PM IST","think"],["🔮","What If Daily","what-if-daily-automation","what_if_daily.yml","7:00 PM & 10:30 PM IST","whatif"],["🌎","FactVerse AI","factverse-ai-automation","factverse.yml","12:00 PM & 6:00 PM IST","factverse"],["📱","Auto Social Post","auto-social-post","generate.yml","12:00 PM & 6:00 PM IST","social"],["💔","Hindi Emotional Reels","hindi-emotional-reels-automation","daily-reel.yml","11:00 AM & 7:00 PM IST","hindi"]];const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const ago=x=>{let m=Math.floor((Date.now()-new Date(x))/60000);return m<1?"just now":m<60?m+" min ago":m<1440?Math.floor(m/60)+" hr ago":Math.floor(m/1440)+" day(s) ago"};const cls=s=>s==="success"?"ok":["failure","cancelled","timed_out"].includes(s)?"bad":["in_progress","queued","waiting","requested"].includes(s)?"run":"neutral";const label=s=>({success:"SUCCESS",failure:"FAILED",cancelled:"CANCELLED",in_progress:"RUNNING",queued:"QUEUED",waiting:"WAITING",requested:"REQUESTED",timed_out:"TIMEOUT"}[s]||(s||"UNKNOWN").toUpperCase());function toast(x){let t=document.getElementById("toast");t.textContent=x;t.style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display="none",3200)}function currentSlot(){let h=Number(new Intl.DateTimeFormat("en-US",{hour:"numeric",hour12:false,timeZone:"Asia/Kolkata"}).format(new Date()));return h<21?"0":"1"}async function runs(p){let r=await fetch(`https://api.github.com/repos/${OWNER}/${p[2]}/actions/workflows/${encodeURIComponent(p[3])}/runs?per_page=8`,{headers:{"Accept":"application/vnd.github+json"}});if(!r.ok)throw Error("GitHub API "+r.status);return r.json()}async function runNow(p,b){b.disabled=true;b.textContent="⏳ STARTING…";try{let body={repo:p[2],workflow:p[3]};if(p[2]==="what-if-daily-automation")body.inputs={slot:currentSlot()};let r=await fetch(RELAY_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Relay HTTP "+r.status);toast("🚀 "+p[1]+" started");b.textContent="✅ STARTED";setTimeout(()=>{b.disabled=false;b.textContent="🚀 RUN NOW";loadAll()},3500)}catch(e){toast("❌ "+e.message);b.disabled=false;b.textContent="🚀 RUN NOW"}}function list(a){if(!Array.isArray(a)||!a.length)return"No data yet.";return a.slice(0,3).map(x=>typeof x==="string"?esc(x):esc(x.topic||x.pattern||x.item||x.name||x.window||x.direction||x.reason||"—")).join(" • ")}async function json(u){let r=await fetch(u+"?ts="+Date.now());if(!r.ok)throw Error("Analytics not published yet");return r.json()}async function strategyBox(k){try{if(k==="none")return"";if(k==="whatif"){let s=await json(U.whatif),h=await json(U.history).catch(()=>[]),sl=s.slots||{},a=sl["0"]||s.slot_0||{},b=sl["1"]||s.slot_1||{},hist=Array.isArray(h)?h:(h.history||h.topics||[]),plan=s.posting_plan||s.plan||{};return `<div class=ai-box><div class=ai-title>🧠 AI GROWTH STRATEGY</div><span class=pill>CONFIDENCE ${esc(s.confidence||"—")}</span><span class=pill>${esc(s.status||"active")}</span><div class=ai-grid><div class=ai-metric><span>Slot 0</span><b>${esc(a.name||"—")}</b><div class=ai-line>${esc(list(a.topics||a.best_lanes||[]))}</div></div><div class=ai-metric><span>Slot 1</span><b>${esc(b.name||"—")}</b><div class=ai-line>${esc(list(b.topics||b.best_lanes||[]))}</div></div></div><div class=ai-line><b>📅 Plan:</b> ${esc(typeof plan==="string"?plan:JSON.stringify(plan))}</div><div class=ai-line><b>📚 Recent:</b> ${esc(list(hist.slice(-6).reverse()))}</div><div class=ai-line>🔄 Analytics → AI Strategy → Next Video</div></div>`}if(k==="social"){let s=await json(U.social),n=(s.next_best_topics||[])[0]||{};return `<div class=ai-box><div class=ai-title>🧠 AI CONTENT STRATEGY</div><span class=pill>CONFIDENCE ${esc(s.confidence||"—")}</span><span class=pill>VIDEOS ${esc(s.data_points||0)}</span><div class=ai-metric><span>Next Video</span><b>${esc(n.topic||"—")}</b><div class=ai-line>🪝 ${esc(n.hook||"—")}<br>🎬 ${esc(n.format||"—")}<br>💡 ${esc(n.reason||s.overall_summary||"—")}</div></div><div class=ai-line><b>🔥 Topics:</b> ${esc(list(s.next_best_topics))}</div><div class=ai-line><b>⏰ Windows:</b> ${esc(list(s.best_posting_windows))}</div></div>`}if(k==="think"){let s=await json(U.think);return `<div class=ai-box><div class=ai-title>🧠 AI QUIZ ANALYTICS</div><span class=pill>DATA ${esc(s.data_source||"—")}</span><span class=pill>POINTS ${esc(s.data_points??"—")}</span><span class=pill>CONFIDENCE ${esc(s.confidence||"—")}</span><div class=ai-line><b>Summary:</b> ${esc(s.overall_summary||"—")}</div><div class=ai-line><b>🏆 Winning:</b> ${esc(list(s.winning_patterns))}</div><div class=ai-line><b>🔧 Improve:</b> ${esc(list(s.improvements))}</div><div class=ai-line><b>🎯 Next Quiz:</b> ${esc(list(s.next_best_quiz_directions))}</div><div class=ai-line><b>⏰ Posting:</b> ${esc(list(s.best_posting_windows))}</div></div>`}if(k==="factverse"){let s=await json(U.factverse),n=s.next_video||{};return `<div class=ai-box><div class=ai-title>🧠 AI FACTVERSE ANALYTICS</div><span class=pill>CONFIDENCE ${esc(s.confidence||"—")}</span><span class=pill>VIDEOS ${esc(s.data_points??0)}</span><div class=ai-grid><div class=ai-metric><span>Next Category</span><b>${esc(n.category||"—")}</b></div><div class=ai-metric><span>Posting</span><b>${esc(n.posting_window||"—")}</b></div></div><div class=ai-line><b>🪝 Hook:</b> ${esc(n.hook_style||"—")}<br><b>💡 Concept:</b> ${esc(n.concept||"—")}<br><b>🏆 Winning:</b> ${esc(list(s.winning_patterns))}<br><b>🔧 Weak:</b> ${esc(list(s.weak_patterns))}<br><b>🧪 Experiment:</b> ${esc(s.experiment||"—")}</div><div class=ai-line>🔄 Analytics → AI Strategy → Next Fact → Analytics</div></div>`}if(k==="hindi"){let s=await json(U.hindi),n=s.next_video||{};return `<div class=ai-box><div class=ai-title>🧠 AI NEXT VIDEO STRATEGY</div><span class=pill>CONFIDENCE ${esc(s.confidence||"—")}</span><span class=pill>DATA ${esc(s.data_points??0)}</span><div class=ai-grid><div class=ai-metric><span>Topic</span><b>${esc(n.topic||"—")}</b></div><div class=ai-metric><span>Emotion</span><b>${esc(n.emotion||"—")}</b></div></div><div class=ai-line>🪝 <b>Hook:</b> ${esc(n.hook_style||"—")}<br>🧩 <b>Structure:</b> ${esc(n.story_structure||"—")}<br>⏰ <b>Posting:</b> ${esc(n.posting_window||"—")}<br>💡 <b>Why:</b> ${esc(n.reason||s.overall_summary||"—")}<br>🧪 <b>Experiment:</b> ${esc(s.experiment||"—")}</div><div class=ai-line>🔄 Analytics → AI Strategy → Next Reel → Analytics</div></div>`}}catch(e){return `<div class=ai-box><div class=ai-title>🧠 AI ANALYTICS</div><div class=err>${esc(e.message)}</div></div>`}}function card(p,d,i){let a=d.workflow_runs||[],x=a[0];if(!x)return `<div class=card><div class=name>${p[0]} ${p[1]}</div><div class=empty>No workflow runs found.</div></div>`;let s=x.conclusion||x.status;return `<div class=card><div class=head><div><div class=name>${p[0]} ${p[1]}</div><div class=repo>${OWNER}/${p[2]}</div></div><span class="badge ${cls(s)}">${label(s)}</span></div><div class=main><div><div class=runno>Run #${x.run_number}</div><div class=time>${ago(x.updated_at)} • ${new Date(x.updated_at).toLocaleString()}</div></div><div class=actions><button class=runbtn onclick="runNow(P[${i}],this)">🚀 RUN NOW</button><a class=open href="https://github.com/${OWNER}/${p[2]}/actions/runs/${x.id}" target=_blank>Open Run ↗</a></div></div><div class=schedule>⏰ <b>Schedule:</b> ${p[4]}${p[2]==="what-if-daily-automation"?`<br>🧠 Manual RUN NOW uses current IST slot: <b>${currentSlot()}</b>`:""}</div><div id="ai-${i}"><div class=empty>Loading AI analytics…</div></div><div class=recent><div class=section-label>Recent runs</div>${a.slice(0,6).map(q=>{let z=q.conclusion||q.status;return `<div class=item><a href="https://github.com/${OWNER}/${p[2]}/actions/runs/${q.id}" target=_blank><span class="dot ${cls(z)}"></span>#${q.run_number} ${esc(q.event||"workflow")}</a><span class=time>${ago(q.updated_at)}</span></div>`}).join("")}</div></div>`}async function loadAll(){document.getElementById("grid").innerHTML=P.map((p,i)=>`<div class=card><div class=name>${p[0]} ${p[1]}</div><div class=empty>Loading…</div></div>`).join("");let r=await Promise.allSettled(P.map(runs)),data=r.map(x=>x.status==="fulfilled"?x.value:{workflow_runs:[],_error:x.reason?.message||"Unable to load"});document.getElementById("grid").innerHTML=data.map((d,i)=>d._error?`<div class=card><div class=name>${P[i][0]} ${P[i][1]}</div><div class=err>${esc(d._error)}</div></div>`:card(P[i],d,i)).join("");let latest=data.map(d=>{let x=(d.workflow_runs||[])[0];return x?x.conclusion||x.status:null}).filter(Boolean);document.getElementById("success").textContent=latest.filter(s=>s==="success").length;document.getElementById("running").textContent=latest.filter(s=>["in_progress","queued","waiting","requested"].includes(s)).length;document.getElementById("failed").textContent=latest.filter(s=>["failure","cancelled","timed_out"].includes(s)).length;document.getElementById("updated").textContent="Updated "+new Date().toLocaleString();await Promise.all(P.map(async(p,i)=>{let e=document.getElementById("ai-"+i);if(e)e.innerHTML=await strategyBox(p[5])}))}loadAll();</script></body></html>
