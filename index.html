<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070b14">
<title>⚡ AI Command Center V3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070b14;color:#eef4ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}.wrap{max-width:1100px;margin:auto;padding:18px 14px 30px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.title{font-size:25px;font-weight:850}.sub,.repo,.time{font-size:11px;color:#8fa0bd}.btn,.runbtn,.open{border-radius:11px;padding:10px 13px;font-weight:800;border:1px solid #263753;text-decoration:none;font-size:11px}.btn{background:#10192b;color:#eef4ff;cursor:pointer}.stats,.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:15px}.grid{grid-template-columns:repeat(2,1fr)}.stat,.card{background:#0f1626;border:1px solid #22304a;border-radius:17px;padding:15px}.stat b{display:block;font-size:24px}.stat span,.recent-title{font-size:10px;color:#8fa0bd;text-transform:uppercase}.head,.main,.item{display:flex;justify-content:space-between;gap:10px}.name{font-size:18px;font-weight:850}.badge{font-size:10px;font-weight:850;padding:6px 9px;border-radius:20px;white-space:nowrap}.ok{background:#123e30;color:#37d996}.bad{background:#461b25;color:#ff8b99}.run{background:#3d3313;color:#ffd166}.neutral{background:#202b3e;color:#aebbd0}.main{align-items:end;margin:17px 0 13px}.runno{font-size:28px;font-weight:900}.actions{display:flex;gap:7px;flex-wrap:wrap}.runbtn{background:#173c31;color:#48e0a4;border-color:#285d4d;cursor:pointer}.runbtn:disabled{opacity:.55;cursor:wait}.open{background:#62a8ff;color:#08111e;border-color:#62a8ff}.recent{border-top:1px solid #22304a;padding-top:10px}.item{padding:7px 0;border-bottom:1px solid #19253a}.item a{color:#eef4ff;text-decoration:none;font-size:11px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#74829a;margin-right:7px}.dot.ok{background:#37d996}.dot.bad{background:#ff6577}.dot.run{background:#ffd166}.schedule{margin:11px 0;padding:9px 10px;background:#0b1220;border:1px solid #1d2b42;border-radius:11px;font-size:11px;color:#9baaca}.empty,.err{font-size:12px;color:#8fa0bd;padding:11px 0}.err{color:#ff9aa6}.foot{text-align:center;color:#64738c;font-size:10px;margin-top:20px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#101b2d;border:1px solid #30425f;color:#eef4ff;padding:11px 16px;border-radius:12px;font-size:12px;font-weight:700;display:none;z-index:99;box-shadow:0 10px 30px #0008}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.title{font-size:21px}.main{align-items:flex-start;flex-direction:column}.actions{width:100%}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><div class="title">⚡ AI Command Center V3</div><div class="sub">GitHub Automation Control • Secure RUN NOW</div></div><button class="btn" onclick="loadAll()">↻ Refresh</button></div>
<div class="stats">
<div class="stat"><b>4</b><span>Automations</span></div>
<div class="stat"><b id="success">—</b><span>Success</span></div>
<div class="stat"><b id="running">—</b><span>Running</span></div>
<div class="stat"><b id="failed">—</b><span>Failed</span></div>
</div>
<div id="grid" class="grid"></div>
<div class="foot">Live public GitHub Actions data • V3 • <span id="updated">—</span></div>
</div>
<div id="toast" class="toast"></div>
<script>
const OWNER="connectwithds5-wq";
const RELAY_URL="https://REPLACE-WITH-YOUR-WORKER-URL.workers.dev";
const P=[
["🎨","Toon Kids","toon_kids_automation","toon_kids_daily.yml","1:00 PM & 8:30 PM IST"],
["🧠","Think Fast Daily","think-fast-daily-automation","think-fast-daily.yml","12:00 PM & 6:00 PM IST"],
["🔮","What If Daily","what-if-daily-automation","what_if_daily.yml","7:00 PM & 10:30 PM IST"],
["🌎","FactVerse AI","factverse-ai-automation","factverse.yml","12:00 PM & 6:00 PM IST"]
];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago=x=>{let m=Math.floor((Date.now()-new Date(x))/60000);return m<1?"just now":m<60?m+" min ago":m<1440?Math.floor(m/60)+" hr ago":Math.floor(m/1440)+" day(s) ago"};
const cls=s=>s==="success"?"ok":["failure","cancelled","timed_out"].includes(s)?"bad":["in_progress","queued","waiting","requested"].includes(s)?"run":"neutral";
const label=s=>({success:"SUCCESS",failure:"FAILED",cancelled:"CANCELLED",in_progress:"RUNNING",queued:"QUEUED",waiting:"WAITING",requested:"REQUESTED",timed_out:"TIMEOUT"}[s]||(s||"UNKNOWN").toUpperCase());
function toast(x){let t=document.getElementById("toast");t.textContent=x;t.style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display="none",3200)}
async function runs(p){let r=await fetch(`https://api.github.com/repos/${OWNER}/${p[2]}/actions/workflows/${encodeURIComponent(p[3])}/runs?per_page=8`,{headers:{"Accept":"application/vnd.github+json"}});if(!r.ok)throw Error("GitHub API "+r.status);return r.json()}
async function runNow(p,btn){
if(RELAY_URL.includes("REPLACE-")){toast("V3 relay URL abhi set nahi hua");return}
btn.disabled=true;btn.textContent="⏳ STARTING…";
try{
let r=await fetch(RELAY_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({repo:p[2],workflow:p[3]})});
let d=await r.json().catch(()=>({}));
if(!r.ok)throw Error(d.error||"Relay HTTP "+r.status);
toast("🚀 "+p[1]+" workflow started");
btn.textContent="✅ STARTED";
setTimeout(()=>{btn.disabled=false;btn.textContent="🚀 RUN NOW";loadAll()},3500);
}catch(e){toast("❌ "+e.message);btn.disabled=false;btn.textContent="🚀 RUN NOW"}
}
function card(p,d){
let a=d.workflow_runs||[],x=a[0];if(!x)return `<div class=card><div class=name>${p[0]} ${p[1]}</div><div class=empty>No workflow runs found.</div></div>`;
let s=x.conclusion||x.status;
return `<div class=card><div class=head><div><div class=name>${p[0]} ${p[1]}</div><div class=repo>${OWNER}/${p[2]}</div></div><span class="badge ${cls(s)}">${label(s)}</span></div><div class=main><div><div class=runno>Run #${x.run_number}</div><div class=time>${ago(x.updated_at)} • ${new Date(x.updated_at).toLocaleString()}</div></div><div class=actions><button class=runbtn onclick="runNow(P[${P.indexOf(p)}],this)">🚀 RUN NOW</button><a class=open href="https://github.com/${OWNER}/${p[2]}/actions/runs/${x.id}" target=_blank>Open Run ↗</a></div></div><div class=schedule>⏰ <b>Schedule:</b> ${p[4]}</div><div class=recent><div class=recent-title>Recent runs</div>${a.slice(0,6).map(q=>{let z=q.conclusion||q.status;return `<div class=item><a href="https://github.com/${OWNER}/${p[2]}/actions/runs/${q.id}" target=_blank><span class="dot ${cls(z)}"></span>#${q.run_number} ${esc(q.event||"workflow")}</a><span class=time>${ago(q.updated_at)}</span></div>`}).join("")}</div></div>`
}
async function loadAll(){
let g=document.getElementById("grid");g.innerHTML=P.map(p=>`<div class=card><div class=name>${p[0]} ${p[1]}</div><div class=empty>Loading GitHub Actions…</div></div>`).join("");
let R=[];for(let p of P)try{R.push([p,await runs(p)])}catch(e){R.push([p,null,e])}
g.innerHTML=R.map(v=>v[1]?card(v[0],v[1]):`<div class=card><div class=name>${v[0][0]} ${v[0][1]}</div><div class=err>${esc(v[2].message)}</div></div>`).join("");
let s=0,f=0,r=0;R.forEach(v=>{let x=v[1]?.workflow_runs?.[0],c=x?.conclusion,t=x?.status;if(c==="success")s++;else if(["failure","cancelled","timed_out"].includes(c))f++;else if(["in_progress","queued","waiting","requested"].includes(t))r++});
success.textContent=s;failed.textContent=f;running.textContent=r;updated.textContent=new Date().toLocaleString()
}
loadAll();setInterval(loadAll,120000);
</script>
</body>
</html>
